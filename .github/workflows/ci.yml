name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t readmission-api:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --rm -p 8000:8000 --name api readmission-api:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break || sleep 2
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'
          docker stop api